<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pose AI Diagnostic</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #status {
      background: #222;
      padding: 18px;
      border-radius: 12px;
      margin: 20px 0;
      word-break: break-word;
    }

    video {
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h2>Pose AI Diagnostic</h2>

<div id="status">Starting...</div>

<button onclick="startCamera()">Start Camera</button>
<button onclick="stopCamera()">Stop Camera</button>

<br>

<video id="video" autoplay playsinline muted></video>

<script type="module">

const status = document.getElementById("status");
const video = document.getElementById("video");

function show(text) {
  status.textContent = text;
  console.log(text);
}

async function testAI() {

  try {

    show("1/5 Connecting to MediaPipe...");

    const module = await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs"
    );

    show("2/5 MediaPipe connected.");

    const PoseLandmarker = module.PoseLandmarker;
    const FilesetResolver = module.FilesetResolver;

    if (!PoseLandmarker || !FilesetResolver) {
      throw new Error(
        "MediaPipe loaded, but PoseLandmarker was not found."
      );
    }

    show("3/5 Loading MediaPipe engine...");

    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm/"
    );

    show("4/5 Loading pose model...");

    const pose = await PoseLandmarker.createFromOptions(
      vision,
      {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
        },

        runningMode: "VIDEO",

        numPoses: 1
      }
    );

    window.pose = pose;

    show("✅ AI LOADED SUCCESSFULLY!");

  } catch (error) {

    console.error("FULL AI ERROR:", error);

    let message = "";

    try {
      message = error.message;
    } catch (e) {}

    if (!message) {
      try {
        message = JSON.stringify(error);
      } catch (e) {}
    }

    if (!message) {
      message = String(error);
    }

    show("❌ AI ERROR: " + message);

  }

}

let stream = null;

async function startCamera() {

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      },
      audio: false
    });

    video.srcObject = stream;

    show("Camera started.");

  } catch (error) {

    show("❌ CAMERA ERROR: " + String(error));

  }

}

function stopCamera() {

  if (stream) {

    stream.getTracks().forEach(
      track => track.stop()
    );

    stream = null;
  }

  video.srcObject = null;

  show("Camera stopped.");

}

window.startCamera = startCamera;
window.stopCamera = stopCamera;

testAI();

</script>

</body>
</html>
