<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pose AI Test</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #status {
      margin: 20px 0;
      padding: 18px;
      background: #222;
      border-radius: 12px;
      word-break: break-word;
    }

    video {
      width: 95%;
      max-width: 600px;
      border-radius: 15px;
      background: black;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h2>Pose AI Test</h2>

<div id="status">Loading AI...</div>

<button id="start">Start Camera</button>
<button id="stop">Stop Camera</button>

<br><br>

<video id="video" autoplay playsinline muted></video>

<script type="module">

const status = document.getElementById("status");
const video = document.getElementById("video");

function show(message) {
  status.textContent = message;
  console.log(message);
}

let pose = null;
let stream = null;

async function loadAI() {

  try {

    show("1/4 Loading MediaPipe...");

    const {
      PoseLandmarker,
      FilesetResolver
    } = await import(
      "https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs"
    );

    show("2/4 MediaPipe loaded.");

    show("3/4 Loading AI engine...");

    const vision = await FilesetResolver.forVisionTasks(
      "https://unpkg.com/@mediapipe/tasks-vision@0.10.21/wasm"
    );

    show("4/4 Loading pose model...");

    pose = await PoseLandmarker.createFromOptions(
      vision,
      {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
        },

        runningMode: "VIDEO",

        numPoses: 1
      }
    );

    show("✅ AI LOADED SUCCESSFULLY!");

  } catch (error) {

    console.error("AI ERROR:", error);

    show(
      "❌ AI ERROR: " +
      (error.message || String(error))
    );
  }
}

document.getElementById("start").onclick = async function() {

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      },
      audio: false
    });

    video.srcObject = stream;

    show("Camera started.");

  } catch (error) {

    show("❌ CAMERA ERROR: " + error.message);

  }

};

document.getElementById("stop").onclick = function() {

  if (stream) {

    stream.getTracks().forEach(
      track => track.stop()
    );

    stream = null;
  }

  video.srcObject = null;

  show("Camera stopped.");

};

loadAI();

</script>

</body>
</html>
