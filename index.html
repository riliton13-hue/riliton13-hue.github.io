<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pose AI Camera</title>

  <!-- MediaPipe -->
  <script type="module">
    import {
      PoseLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

    window.PoseLandmarker = PoseLandmarker;
    window.FilesetResolver = FilesetResolver;
  </script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 15px 0 5px;
    }

    #status {
      margin: 8px;
      min-height: 25px;
    }

    #cameraBox {
      position: relative;
      width: 95%;
      max-width: 600px;
      margin: auto;
    }

    #camera {
      width: 100%;
      border-radius: 15px;
      display: block;
      background: black;
    }

    #skeleton {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #photo {
      width: 95%;
      max-width: 600px;
      margin-top: 15px;
      border-radius: 15px;
      display: none;
    }

    button {
      margin: 6px;
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    #timer {
      font-size: 65px;
      font-weight: bold;
      position: fixed;
      top: 40%;
      left: 0;
      right: 0;
      display: none;
      z-index: 10;
    }

    #aiBox {
      width: 95%;
      max-width: 600px;
      margin: 12px auto;
      padding: 12px;
      border-radius: 12px;
      background: #222;
      box-sizing: border-box;
    }
  </style>
</head>

<body>

<h1>🤖 Pose AI Camera</h1>

<div id="cameraBox">
  <video id="camera" autoplay playsinline></video>
  <canvas id="skeleton"></canvas>
</div>

<div id="aiBox">
  <div id="aiStatus">🧠 AI loading...</div>
</div>

<div>
  <button id="start">📷 Start Camera</button>
  <button id="stop">⛔ Stop</button>
  <button id="switch">🔄 Switch</button>
</div>

<div>
  <button id="photoBtn">📸 Photo</button>
  <button id="timerBtn">⏱️ 3 Sec Timer</button>
</div>

<p id="status">Camera stopped</p>

<div id="timer">3</div>

<img id="photo">

<br>

<a id="download" style="display:none;" download="pose-ai-photo.png">
  <button>💾 Save Photo</button>
</a>

<canvas id="captureCanvas" style="display:none;"></canvas>

<script>

let stream = null;
let facingMode = "environment";

let poseLandmarker = null;
let aiRunning = false;
let lastVideoTime = -1;

const video = document.getElementById("camera");
const skeleton = document.getElementById("skeleton");
const ctx = skeleton.getContext("2d");

const photo = document.getElementById("photo");
const captureCanvas = document.getElementById("captureCanvas");

const status = document.getElementById("status");
const aiStatus = document.getElementById("aiStatus");
const timerDisplay = document.getElementById("timer");
const download = document.getElementById("download");


/* =========================
   LOAD AI
========================= */

async function loadAI() {

  try {

    aiStatus.textContent = "🧠 Loading Pose AI...";

    const vision =
      await window.FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
      );

    poseLandmarker =
      await window.PoseLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
          },

          runningMode: "VIDEO",

          numPoses: 1,

          minPoseDetectionConfidence: 0.5,

          minPosePresenceConfidence: 0.5,

          minTrackingConfidence: 0.5
        }
      );

    aiStatus.textContent = "🧠 Pose AI ready!";

    if (stream) {
      startAI();
    }

  } catch (error) {

    console.error(error);

    aiStatus.textContent =
      "❌ AI failed to load";

  }

}


/* =========================
   CAMERA
========================= */

async function startCamera() {

  status.textContent = "Starting camera...";

  try {

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: facingMode
        }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    status.textContent = "✅ Camera running";

    if (poseLandmarker) {
      startAI();
    }

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Camera error: " + error.name;

  }
}


function stopCamera() {

  if (stream) {

    stream.getTracks().forEach(
      track => track.stop()
    );

    stream = null;
  }

  video.srcObject = null;

  aiRunning = false;

  ctx.clearRect(
    0,
    0,
    skeleton.width,
    skeleton.height
  );

  status.textContent = "Camera stopped";
}


/* =========================
   SWITCH CAMERA
========================= */

async function switchCamera() {

  facingMode =
    facingMode === "user"
      ? "environment"
      : "user";

  await startCamera();
}


/* =========================
   POSE AI
========================= */

function startAI() {

  if (aiRunning) return;

  aiRunning = true;

  requestAnimationFrame(
    detectPose
  );
}


function detectPose() {

  if (!aiRunning) return;

  if (
    video.readyState >= 2 &&
    poseLandmarker
  ) {

    if (
      video.currentTime !==
      lastVideoTime
    ) {

      lastVideoTime =
        video.currentTime;

      const results =
        poseLandmarker.detectForVideo(
          video,
          performance.now()
        );

      drawPose(results);
    }
  }

  requestAnimationFrame(
    detectPose
  );
}


/* =========================
   DRAW SKELETON
========================= */

function drawPose(results) {

  skeleton.width =
    video.videoWidth;

  skeleton.height =
    video.videoHeight;

  ctx.clearRect(
    0,
    0,
    skeleton.width,
    skeleton.height
  );

  if (
    !results.landmarks ||
    results.landmarks.length === 0
  ) {

    aiStatus.textContent =
      "🧠 Looking for a person...";

    return;
  }

  aiStatus.textContent =
    "🟢 Person detected!";

  const landmarks =
    results.landmarks[0];


  /* BODY CONNECTIONS */

  const connections = [

    [0,1],[1,2],[2,3],[3,7],
    [0,4],[4,5],[5,6],[6,8],

    [9,10],

    [11,12],

    [11,13],
    [13,15],

    [12,14],
    [14,16],

    [11,23],
    [12,24],

    [23,24],

    [23,25],
    [25,27],

    [24,26],
    [26,28],

    [27,29],
    [29,31],

    [28,30],
    [30,32]

  ];


  /* DRAW LINES */

  ctx.lineWidth = 5;
  ctx.lineCap = "round";

  connections.forEach(
    ([a,b]) => {

      const p1 = landmarks[a];
      const p2 = landmarks[b];

      if (!p1 || !p2) return;

      ctx.beginPath();

      ctx.moveTo(
        p1.x * skeleton.width,
        p1.y * skeleton.height
      );

      ctx.lineTo(
        p2.x * skeleton.width,
        p2.y * skeleton.height
      );

      ctx.stroke();
    }
  );


  /* DRAW JOINTS */

  landmarks.forEach(point => {

    if (point.visibility < 0.4)
      return;

    const x =
      point.x * skeleton.width;

    const y =
      point.y * skeleton.height;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      6,
      0,
      Math.PI * 2
    );

    ctx.fill();
  });

}


/* =========================
   TAKE PHOTO
========================= */

function takePhoto() {

  if (!stream) {

    status.textContent =
      "⚠️ Start the camera first";

    return;
  }

  captureCanvas.width =
    video.videoWidth;

  captureCanvas.height =
    video.videoHeight;

  const captureCtx =
    captureCanvas.getContext("2d");

  captureCtx.drawImage(
    video,
    0,
    0,
    captureCanvas.width,
    captureCanvas.height
  );

  const image =
    captureCanvas.toDataURL(
      "image/png"
    );

  photo.src = image;

  photo.style.display =
    "block";

  download.href = image;

  download.style.display =
    "inline-block";

  status.textContent =
    "📸 Photo captured!";
}


/* =========================
   TIMER
========================= */

function startTimer() {

  if (!stream) {

    status.textContent =
      "⚠️ Start the camera first";

    return;
  }

  let count = 3;

  timerDisplay.textContent =
    count;

  timerDisplay.style.display =
    "block";

  const interval =
    setInterval(() => {

      count--;

      if (count > 0) {

        timerDisplay.textContent =
          count;

      } else {

        clearInterval(interval);

        timerDisplay.style.display =
          "none";

        takePhoto();

      }

    }, 1000);
}


/* =========================
   BUTTONS
========================= */

document
  .getElementById("start")
  .addEventListener(
    "click",
    startCamera
  );

document
  .getElementById("stop")
  .addEventListener(
    "click",
    stopCamera
  );

document
  .getElementById("switch")
  .addEventListener(
    "click",
    switchCamera
  );

document
  .getElementById("photoBtn")
  .addEventListener(
    "click",
    takePhoto
  );

document
  .getElementById("timerBtn")
  .addEventListener(
    "click",
    startTimer
  );


/* START AI */

loadAI();

</script>

</body>
</html>
