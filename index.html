<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pose AI Camera</title>

<style>
body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 18px 0 5px;
}

#status {
    color: #aaa;
    margin: 10px;
}

.camera {
    width: 95%;
    max-width: 650px;
    margin: auto;
    background: black;
    border-radius: 18px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 15px 10px;
    margin: 5px;
    background: #292929;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.main-buttons {
    max-width: 650px;
    width: 95%;
    margin: 15px auto;
}

.capture {
    width: 90%;
    background: white;
    color: black;
    font-size: 20px;
}

#countdown {
    font-size: 70px;
    font-weight: bold;
    height: 80px;
}

#preview {
    display: none;
    width: 95%;
    max-width: 650px;
    margin: 15px auto;
    border-radius: 15px;
}

#save {
    display: none;
    background: #20b965;
}
</style>
</head>

<body>

<h1>Pose AI Camera</h1>

<div id="status">Camera is off</div>

<div class="camera">
    <video id="video" autoplay playsinline></video>
</div>

<div id="countdown"></div>

<div class="main-buttons">

    <button onclick="startCamera()">📷 Start Camera</button>

    <button onclick="stopCamera()">⏹ Stop</button>

    <button onclick="switchCamera()">🔄 Switch</button>

    <button onclick="takePhoto()">📸 Photo</button>

    <button onclick="startTimer()">⏱️ 3 Sec Timer</button>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<img id="preview">

<button id="save" onclick="savePhoto()">💾 Save Photo</button>


<script>

let stream = null;
let cameraFacing = "user";
let photoData = null;
let timerRunning = false;

const video = document.getElementById("video");
const status = document.getElementById("status");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");
const saveButton = document.getElementById("save");
const countdown = document.getElementById("countdown");


/* START CAMERA */

async function startCamera() {

    try {

        status.textContent = "Starting camera...";

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }

        stream = await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: {
                    ideal: cameraFacing
                },
                width: {
                    ideal: 1280
                },
                height: {
                    ideal: 720
                }
            },

            audio: false

        });

        video.srcObject = stream;

        await video.play();

        status.textContent =
            cameraFacing === "user"
            ? "🟢 Front camera"
            : "🟢 Back camera";

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "❌ Camera error: " + error.message;

    }
}


/* STOP */

function stopCamera() {

    if (stream) {

        stream.getTracks().forEach(track => track.stop());

        stream = null;
    }

    video.srcObject = null;

    status.textContent = "Camera is off";
}


/* SWITCH CAMERA */

async function switchCamera() {

    if (!stream) {

        status.textContent =
            "Start the camera first.";

        return;
    }

    cameraFacing =
        cameraFacing === "user"
        ? "environment"
        : "user";

    status.textContent =
        "Switching camera...";

    await startCamera();
}


/* TAKE PHOTO */

function takePhoto() {

    if (!stream) {

        status.textContent =
            "❌ Start the camera first.";

        return;
    }

    if (video.readyState < 2 ||
        video.videoWidth === 0) {

        status.textContent =
            "Camera is still loading. Try again.";

        return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    /*
      Mirror ONLY the front camera
    */

    if (cameraFacing === "user") {

        ctx.save();

        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);

        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.restore();

    } else {

        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );
    }

    photoData =
        canvas.toDataURL(
            "image/jpeg",
            0.95
        );

    preview.src = photoData;

    preview.style.display = "block";

    saveButton.style.display = "inline-block";

    status.textContent =
        "📸 Photo captured!";

}


/* TIMER */

function startTimer() {

    if (!stream) {

        status.textContent =
            "❌ Start the camera first.";

        return;
    }

    if (timerRunning)
        return;

    timerRunning = true;

    let seconds = 3;

    countdown.textContent = seconds;

    const timer = setInterval(() => {

        seconds--;

        if (seconds > 0) {

            countdown.textContent =
                seconds;

        } else {

            clearInterval(timer);

            countdown.textContent = "";

            timerRunning = false;

            takePhoto();

        }

    }, 1000);
}


/* SAVE */

function savePhoto() {

    if (!photoData)
        return;

    const link =
        document.createElement("a");

    link.href = photoData;

    link.download =
        "PoseAI-" + Date.now() + ".jpg";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

}

</script>

</body>
</html>
